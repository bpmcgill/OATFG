name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # The lint integration tests verify generated Python/JS suites with the real
      # toolchains; windows runners ship Python and Node, Robot Framework is added here.
      - name: Install Robot Framework (for generated-suite linting)
        run: python -m pip install robotframework robotframework-requests

      - name: Restore
        run: dotnet restore OATFG.sln

      - name: Build
        run: dotnet build OATFG.sln -c Release --no-restore

      - name: Test
        run: dotnet test OATFG.sln -c Release --no-build --no-restore