name: Release

# Creates a GitHub Release with a packaged Windows build whenever a semver tag (v*) is pushed:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build OATFG.sln -c Release --nologo

      - name: Test
        run: dotnet test OATFG.sln -c Release --no-build --nologo

      - name: Publish UI (win-x64, self-contained)
        run: dotnet publish OATFG.UI/OATFG.UI.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath OATFG.UI-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: OATFG.UI-win-x64.zip
          generate_release_notes: true